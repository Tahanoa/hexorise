name: Java CI
on:
  push:
    branches: [master, main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: hexora_highrise
          POSTGRES_USER: hexora
          POSTGRES_PASSWORD: ci-database-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hexora -d hexora_highrise"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      RUN_DB_TESTS: "true"
      POSTGRES_PASSWORD: ci-database-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - run: ./mvnw -B clean verify
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check management panel against PostgreSQL
        run: |
          npm install --prefix /tmp/hexorise-panel-check playwright@1.51.1
          node /tmp/hexorise-panel-check/node_modules/playwright/cli.js install --with-deps chromium
          NODE_PATH=/tmp/hexorise-panel-check/node_modules node scripts/panel-smoke.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: panel-screenshots
          path: target/panel-check/
          if-no-files-found: ignore
