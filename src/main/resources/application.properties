spring.application.name=hexorise
server.port=${PORT:8080}
server.shutdown=graceful
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true

# PostgreSQL is the only supported database.
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/hexora_highrise}
spring.datasource.username=${POSTGRES_USER:hexora}
spring.datasource.password=${POSTGRES_PASSWORD}

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized
management.endpoint.health.probes.enabled=true

hexora.admin.username=${ADMIN_USERNAME:admin}
hexora.admin.password=${ADMIN_PASSWORD}
hexora.highrise.enabled=${HIGHRISE_ENABLED:false}
hexora.highrise.room-id=${HIGHRISE_ROOM_ID:}
hexora.highrise.api-token=${HIGHRISE_API_TOKEN:}
