server:
  port: ${PORT:8080}
  shutdown: graceful
spring:
  application:
    name: hexorise
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/hexora_highrise}
    username: ${POSTGRES_USER:hexora}
    password: ${POSTGRES_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
hexora:
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD}
  highrise:
    enabled: ${HIGHRISE_ENABLED:false}
    room-id: ${HIGHRISE_ROOM_ID:}
    api-token: ${HIGHRISE_API_TOKEN:}
